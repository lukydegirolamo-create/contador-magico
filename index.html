<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Regresivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        #countdown {
            font-size: 1em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Contador Regresivo</h1>
    <p>Tiempo restante hasta las 9:54 PM 04/12/25</p>
    <div id="countdown"></div>

    <script>
        // Fecha objetivo: 4 de Diciembre de 2025, 9:54 PM Hora Argentina (UTC-3)
        // Convertido a UTC: 5 de Diciembre de 2025, 00:54:00 UTC
        const targetDate = new Date('2025-12-05T00:54:00Z');
        let hasRedirected = false; // Para evitar redirigir múltiples veces

        function updateCountdown() {
            const now = new Date();
            const timeDifference = targetDate - now;

            if (timeDifference <= 0) {
                document.getElementById('countdown').innerHTML = '¡El tiempo ha llegado! Redirigiendo a la canción...';
                if (!hasRedirected) {
                    // Redirigir a YouTube
                    window.location.href = 'https://www.youtube.com/watch?v=VEfkNHTjgs8&list=RDVEfkNHTjgs8&start_radio=1';
                    hasRedirected = true;
                }
                return;
            }

            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerHTML = 
                `${days} días, ${hours} horas, ${minutes} minutos, ${seconds} segundos`;
        }

        // Actualizar cada segundo
        setInterval(updateCountdown, 1000);
        // Llamar una vez al cargar
        updateCountdown();
    </script>
</body>
</html>
